# Статическая отдача визитки argonautica-systems.ru (см. docs/DEPLOY.md → Marketing site).
# Наружу этот контейнер не смотрит: порты не публикуются, TLS и HTTP/3 терминирует
# прод-nginx, который проксирует сюда по имени `argonautica-site` в сети `gateway`.
#
# PHP тут НЕ исполняется — рядом с вёрсткой лежат send.php/poll.php/config*.php от
# старого хостинга. Без явных запретов nginx отдал бы их ИСХОДНИКОМ, то есть слил бы
# токен бота из config*.php открытым текстом. JS-бандл сайта ни один .php не дёргает,
# так что 404 здесь ничего не ломает.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;

    # Точечные файлы (.htaccess, .argo.db, .git…), БД, исходники, конфиги.
    location ~ /\.                                               { return 404; }
    location ~* \.(php|db|sqlite|sqlite3|md|lock|sh|log|ini|sql)$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Ассеты с хешем в имени иммутабельны — кэшируем надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
