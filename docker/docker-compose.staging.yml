# Тестовый стенд (staging) из ветки develop. ПОЛНОСТЬЮ изолирован от прод-стека
# (docker-compose.prod.yml): отдельное имя проекта → своя сеть, свои контейнеры и свой
# namespace volume'ов (platform-staging_*). Прод-данные НЕ затрагиваются.
#
# Отличия от прода:
#   - имя проекта platform-staging — КЛЮЧЕВАЯ изоляция (иначе совпали бы контейнеры/
#     сеть/volume'ы прод-проекта). Задаётся флагом `-p platform-staging` в
#     deploy-staging.sh (top-level `name:` не поддерживается docker-compose v1);
#   - один backend (без blue-green — стенду не нужен zero-downtime);
#   - nginx стенда НИЧЕГО не публикует наружу — он внутренний реверс-прокси, доступ
#     снаружи идёт ЧЕРЕЗ прод-nginx (сеть `gateway`, см. docker-compose.prod.yml и
#     docs/DEPLOY.md → Staging). TLS терминирует прод-nginx под свой сертификат;
#   - НЕТ сервиса bot (прод-бот на long-polling с тем же токеном сломался бы от 2-го поллера);
#   - ЕСТЬ сервис intake-bot (scripts/intake_bot.py, ARG-92) — бот-воронка приёма/оплаты
#     на СВОЁМ Telegram-токене (TELEGRAM_INTAKE_BOT_TOKEN), свой getUpdates-поллер, поэтому
#     конфликта с прод-ботом нет и запрет выше на него не распространяется (см. ADR-029,
#     docs/TELEGRAM_BOT.md). Пусто в TELEGRAM_INTAKE_BOT_TOKEN — контейнер просто падает
#     при старте (SystemExit), это ожидаемо для окружений без выданного тестового токена;
#   - свой (упрощённый, HTTP-only) nginx-шаблон (docker/nginx-staging).
#
# Первый запуск / bootstrap — см. шапку docker/deploy-staging.sh.
# Деплой новой версии: docker/deploy-staging.sh (вызывается из CI на push в develop).

x-backend: &backend
  build:
    context: ../backend
  image: platform-staging-backend:latest
  env_file: ../.env
  environment:
    UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
  depends_on:
    - postgres
    - redis
    - minio
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # One-shot: применить миграции. profiles → не стартует на `up`, только явным
  # `run --rm migrate` (первый запуск / deploy-staging.sh перед подъёмом backend).
  migrate:
    <<: *backend
    profiles: ["migrate"]
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # Единственный backend — blue-green стенду не нужен.
  backend:
    <<: *backend

  # Серверный транскод видео (docs/FILES.md «Video transcode»). Тот же образ и env,
  # что у backend, но вместо uvicorn — воркер очереди. Без него загруженные видео
  # копятся в Redis-очереди и НИКОГДА не транскодятся (отдаётся оригинал).
  transcode-worker:
    <<: *backend
    command: ["python", "-m", "app.worker.transcode"]
    healthcheck:
      disable: true   # не HTTP-сервер — healthcheck из Dockerfile тут неприменим

  # Бот-воронка приёма и оплаты (ARG-92, backend/scripts/intake_bot.py). Свой Telegram-
  # токен (TELEGRAM_INTAKE_BOT_TOKEN) → свой getUpdates-поллер → не конфликтует с
  # прод-ботом (см. комментарий про "НЕТ сервиса bot" выше и ADR-029). Не участвует в
  # blue-green — стенду он и не нужен.
  intake-bot:
    <<: *backend
    command: ["python", "-m", "scripts.intake_bot"]
    environment:
      # Служебный /reset в админском DM: снести прогон воронки и созданного им
      # пользователя, чтобы гонять воронку с одного аккаунта бесконечно (ARG-95).
      # Только стенд — в прод-compose этого флага нет и быть не должно.
      INTAKE_BOT_ALLOW_RESET: "1"
    healthcheck:
      disable: true   # бот не слушает :8000 — стандартный HTTP-healthcheck неприменим

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    depends_on:
      - backend
      - frontend
    # Никаких ports: — контейнер не публикует ничего наружу, к нему заходят только
    # изнутри docker-сети (прод-nginx через `gateway`, см. комментарий выше).
    environment:
      DOMAIN: ${DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
    volumes:
      - ./nginx-staging/templates:/etc/nginx/templates:ro
    networks:
      # `default` обязателен явно, раз список не пуст — иначе backend/frontend/minio
      # станут недостижимы для этого контейнера.
      default: {}
      # Мост к прод-compose-проекту (docker), создан один раз вручную
      # (`docker network create gateway`), объявлен `external` в обоих compose-файлах.
      # Свой alias ОБЯЗАТЕЛЕН: сервис в обоих compose называется `nginx`, поэтому
      # дефолтный DNS-алиас (= имя сервиса) на общей сети `gateway` коллизирует между
      # прод- и staging-nginx. `staging_nginx` — то самое имя, на которое проксирует
      # прод (см. docker/nginx/templates/default.conf.template).
      gateway:
        aliases:
          - staging_nginx
    restart: unless-stopped

networks:
  gateway:
    external: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
