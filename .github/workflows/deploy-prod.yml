name: Deploy → production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.claude/' \
            --exclude='**/__pycache__/' \
            --exclude='**/*.pyc' \
            --exclude='frontend/node_modules/' \
            --exclude='backend/.venv/' \
            --exclude='docker/nginx/certs/' \
            --exclude='docker/nginx/active_backend.conf' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/platform/

      # active_backend.conf — это СОСТОЯНИЕ сервера (какой цвет сейчас в проде), а не
      # код: его правит deploy.sh на каждом выкате. Раньше он ехал вместе с репо, где
      # зашит backend-blue, поэтому rsync затирал указатель ПЕРЕД запуском deploy.sh —
      # тот считал активным blue при живом green и «выкатывал» green, то есть
      # пересоздавал контейнер, обслуживающий трафик (502 на /api, пока он не healthy).
      # Blue-green превращался в деплой с даунтаймом. Теперь файл исключён из основного
      # rsync, а сюда доезжает ТОЛЬКО если на сервере его ещё нет (--ignore-existing) —
      # это первый деплой на чистую машину, где иначе docker создал бы каталог на месте
      # bind-mount'а и уронил nginx.
      - name: Seed active_backend.conf on a fresh server (never overwrite)
        run: |
          rsync -az --ignore-existing \
            -e "ssh -o StrictHostKeyChecking=no" \
            docker/nginx/active_backend.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/platform/docker/nginx/

      - name: Blue-green deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/platform && bash docker/deploy.sh"

      # transcode-worker — singleton вне blue-green (тянет задачи из Redis-очереди, второй
      # такой же дрался бы за те же видео), поэтому deploy.sh его сознательно не трогает.
      # Побочный эффект: он остаётся на СТАРОМ образе после каждого выката, пока его не
      # поднимут руками — то есть правки транскода на прод не доезжают вовсе. А если
      # контейнера нет совсем, авария молчит: загрузка видео проходит, деплой зелёный,
      # видео просто копятся в очереди и пользователю отдаётся тяжёлый оригинал.
      # На стенде этого класса багов нет — deploy-staging.sh делает `up -d` на весь стек.
      # Без --force-recreate: compose пересоздаст контейнер, только если сменился image ID
      # (deploy.sh пересобирает platform-backend:latest шагом раньше), иначе это no-op и
      # текущее транскодирование не обрывается на середине.
      - name: Restart the video transcode worker (deploy.sh leaves it on the old image)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash -s <<'EOF'
          set -euo pipefail
          cd /opt/platform/docker
          DC="docker compose -f docker-compose.prod.yml --env-file ../.env"
          $DC up -d --no-deps transcode-worker
          # ps -a: контейнер, упавший сразу после старта, в обычный `ps -q` уже не попадает —
          # без -a шаг сказал бы «не создан» вместо того, чтобы показать логи падения.
          cid="$($DC ps -a -q transcode-worker)"
          [ -n "$cid" ] || { echo "::error::transcode-worker не создан — видео не будут транскодироваться"; exit 1; }
          sleep 3
          running="$(docker inspect -f '{{.State.Running}}' "$cid")"
          echo "transcode-worker running=$running ($cid)"
          if [ "$running" != true ]; then
            echo "::error::transcode-worker не работает — видео будут копиться в очереди"
            docker logs --tail 50 "$cid" 2>&1 || true
            exit 1
          fi
          EOF

      # nginx резолвит имена апстримов из upstream{} ОДИН РАЗ и кэширует IP; `nginx -s
      # reload` в deploy.sh их не обновляет. Новый цвет поднимается с новым IP, поэтому
      # после переключения nginx стучится по адресу мёртвого контейнера и отдаёт 502 на
      # ВЕСЬ /api/ и /ws — до ручного пересоздания. Проверено на выкате 15.08 15:32 UTC:
      # blue поднялся на 172.18.0.10, nginx после reload ходил в 172.18.0.5
      # («connect() failed (113: No route to host)»).
      # deploy-staging.sh это уже лечит --force-recreate; прод-скрипт трогать нельзя
      # (docs/DEPLOY.md → «Do NOT touch»), поэтому пересоздаём отсюда. Пересоздание
      # заодно ре-рендерит шаблон через envsubst — правки конфига доезжают тем же шагом.
      - name: Recreate nginx (it caches upstream IPs; reload does not refresh them)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/platform/docker && docker compose -f docker-compose.prod.yml --env-file ../.env up -d --force-recreate --no-deps nginx && sleep 2 && docker compose -f docker-compose.prod.yml --env-file ../.env exec -T nginx nginx -t"

      # Визитка живёт своим compose-проектом (docs/DEPLOY.md → Marketing site), поэтому
      # deploy.sh её не трогает — и это правильно. Но подъём здесь идемпотентен: если
      # контейнер уже работает и конфиг не менялся, шаг ничего не делает; если контейнер
      # снесли или в репо поправили docker/argonautica-site/nginx.conf — он вернётся с
      # актуальным конфигом. Контент сайта лежит вне репо и не перезаписывается.
      - name: Ensure the marketing site is up (own compose project)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/platform && docker compose -p argonautica-site -f docker/argonautica-site.compose.yml up -d"

      - name: Smoke-check prod through the edge
        run: |
          for url in https://platform.argonautica-systems.ru/api/health https://argonautica-systems.ru/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || { echo "::error::$url ответил $code"; exit 1; }
          done
