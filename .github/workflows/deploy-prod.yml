name: Deploy → production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.claude/' \
            --exclude='**/__pycache__/' \
            --exclude='**/*.pyc' \
            --exclude='frontend/node_modules/' \
            --exclude='backend/.venv/' \
            --exclude='docker/nginx/certs/' \
            --exclude='docker/nginx/active_backend.conf' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/platform/

      # active_backend.conf — это СОСТОЯНИЕ сервера (какой цвет сейчас в проде), а не
      # код: его правит deploy.sh на каждом выкате. Раньше он ехал вместе с репо, где
      # зашит backend-blue, поэтому rsync затирал указатель ПЕРЕД запуском deploy.sh —
      # тот считал активным blue при живом green и «выкатывал» green, то есть
      # пересоздавал контейнер, обслуживающий трафик (502 на /api, пока он не healthy).
      # Blue-green превращался в деплой с даунтаймом. Теперь файл исключён из основного
      # rsync, а сюда доезжает ТОЛЬКО если на сервере его ещё нет (--ignore-existing) —
      # это первый деплой на чистую машину, где иначе docker создал бы каталог на месте
      # bind-mount'а и уронил nginx.
      - name: Seed active_backend.conf on a fresh server (never overwrite)
        run: |
          rsync -az --ignore-existing \
            -e "ssh -o StrictHostKeyChecking=no" \
            docker/nginx/active_backend.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/platform/docker/nginx/

      - name: Blue-green deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/platform && bash docker/deploy.sh"

      # nginx резолвит имена апстримов из upstream{} ОДИН РАЗ и кэширует IP; `nginx -s
      # reload` в deploy.sh их не обновляет. Новый цвет поднимается с новым IP, поэтому
      # после переключения nginx стучится по адресу мёртвого контейнера и отдаёт 502 на
      # ВЕСЬ /api/ и /ws — до ручного пересоздания. Проверено на выкате 15.08 15:32 UTC:
      # blue поднялся на 172.18.0.10, nginx после reload ходил в 172.18.0.5
      # («connect() failed (113: No route to host)»).
      # deploy-staging.sh это уже лечит --force-recreate; прод-скрипт трогать нельзя
      # (docs/DEPLOY.md → «Do NOT touch»), поэтому пересоздаём отсюда. Пересоздание
      # заодно ре-рендерит шаблон через envsubst — правки конфига доезжают тем же шагом.
      - name: Recreate nginx (it caches upstream IPs; reload does not refresh them)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/platform/docker && docker compose -f docker-compose.prod.yml --env-file ../.env up -d --force-recreate --no-deps nginx && sleep 2 && docker compose -f docker-compose.prod.yml --env-file ../.env exec -T nginx nginx -t"

      - name: Smoke-check prod through the edge
        run: |
          for url in https://platform.argonautica-systems.ru/api/health https://argonautica-systems.ru/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || { echo "::error::$url ответил $code"; exit 1; }
          done
