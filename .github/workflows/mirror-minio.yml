name: Mirror minio image

# Разовая задача: MinIO убрал образы из публичных реестров (Docker Hub minio/minio -> 404,
# quay.io -> 401), а CI тянул их на каждый прогон. Берём архив образа с прода
# (draft-релиз minio-mirror-2025-09-07) и кладём в GHCR под тем же тегом.
# CI и test-compose используют ghcr.io/<owner>/minio.
on:
  workflow_dispatch:
  push:
    branches: [fix/ci-minio-quay]
    paths: [.github/workflows/mirror-minio.yml]

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      TAG: RELEASE.2025-09-07T16-13-09Z
    steps:
      - name: Download image archive from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download minio-mirror-2025-09-07 -R "$GITHUB_REPOSITORY" -p minio-image.tar.gz
      - run: gunzip -c minio-image.tar.gz | docker load
      - name: Relabel (link package to repo) and push
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minio:${TAG}"
          printf 'FROM minio/minio:%s\nLABEL org.opencontainers.image.source=https://github.com/%s\n' "$TAG" "$GITHUB_REPOSITORY" | docker build -t "$IMG" -
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMG"
